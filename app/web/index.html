<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ETF 매집 레이더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --raised:#F7F9FB; --ink:#10161F; --ink2:#465264; --ink3:#8590A2; --line:#E1E6ED;
  --accent:#0B8F80; --accent-bg:#E0F4F1; --on-accent:#FFFFFF;
  --up:#DE3A2F; --up-bg:#FDECEA; --down:#2467DB; --down-bg:#E7EFFD; --warn:#8A5A06; --warn-bg:#FBF1DC; --live:#12A150;
  --display:"Gothic A1","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,22,31,.04),0 8px 24px rgba(16,22,31,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F15; --surface:#121922; --raised:#18212C; --ink:#EAF0F7; --ink2:#A7B3C4; --ink3:#728096; --line:#222D3A;
    --accent:#35D0BC; --accent-bg:#0F2B2A; --on-accent:#062320;
    --up:#FF6B5E; --up-bg:#351917; --down:#5D9CFF; --down-bg:#13264A; --warn:#E5B45A; --warn-bg:#33270F; --live:#3DDC84;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F15; --surface:#121922; --raised:#18212C; --ink:#EAF0F7; --ink2:#A7B3C4; --ink3:#728096; --line:#222D3A;
  --accent:#35D0BC; --accent-bg:#0F2B2A; --on-accent:#062320;
  --up:#FF6B5E; --up-bg:#351917; --down:#5D9CFF; --down-bg:#13264A; --warn:#E5B45A; --warn-bg:#33270F; --live:#3DDC84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}
html{font-size:100%} html.big{font-size:118%}
/* 한글은 기본이 글자 단위 줄바꿈이라 '순매수 중/입니다'처럼 끊긴다 — 띄어쓰기에서만 줄을 바꾼다 */
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
p,li,dd,.sub{text-wrap:pretty}
.more,.chip,.close,.seg button,.chips button,.tabbar button,.nav button{white-space:nowrap;flex:none}
*{box-sizing:border-box} [hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--ink3)} .sub{color:var(--ink2);font-size:.88rem}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1360px;margin-inline:auto;padding:.6rem 16px;display:flex;align-items:center;gap:.6rem}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.brand i{width:1.35rem;height:1.35rem;border-radius:50%;border:2px solid var(--accent);position:relative;display:inline-block;flex:none}
.brand i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:conic-gradient(from 20deg,var(--accent) 0 28%,transparent 0)}
.nav{display:none;gap:.15rem;flex:1}
.nav button{padding:.45rem .8rem;border-radius:8px;color:var(--ink2);font-weight:500}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.stamp{margin-left:auto;font-size:.8rem;color:var(--ink2);display:flex;align-items:center;gap:.4rem;white-space:nowrap;min-width:0;overflow:hidden}
.stamp .asof{display:none} .top .in{min-width:0} .brand{min-width:0}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--ink3);flex:none} .dot.on{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 .45rem transparent}100%{box-shadow:0 0 0 0 transparent}} @media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
.fs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.fs button{padding:.25rem .55rem;color:var(--ink2);font-weight:600} .fs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.notice-bar{background:var(--warn-bg);color:var(--warn);font-size:.85rem;padding:.5rem 16px;text-align:center}

/* 뼈대 */
.page{max-width:1360px;margin-inline:auto;padding:1rem 16px 5.5rem;display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
.col{display:grid;gap:1rem;align-content:start;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem;min-width:0}
.card > header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.4rem .75rem;margin-bottom:.75rem}
.card > header h2{font-size:1.05rem} .card > header .more{color:var(--accent);font-weight:600;font-size:.88rem;white-space:nowrap}
.eyebrow{font-size:.78rem;font-weight:600;color:var(--accent);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:.25rem;padding:.1rem .5rem;border-radius:6px;background:var(--raised);color:var(--ink2);font-size:.78rem;font-weight:500;white-space:nowrap}
.chip.up{background:var(--up-bg);color:var(--up)} .chip.down{background:var(--down-bg);color:var(--down)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.acc{background:var(--accent-bg);color:var(--accent)}
.info{display:inline-grid;place-items:center;width:1.15rem;height:1.15rem;border-radius:50%;border:1px solid var(--ink3);color:var(--ink3);font-size:.7rem;font-weight:700;margin-left:.25rem;vertical-align:.1em;font-family:var(--body)}
.tip{background:var(--raised);border-radius:10px;padding:.6rem .75rem;font-size:.88rem;color:var(--ink2);margin:.25rem 0 .75rem}
.empty{border:1px dashed var(--line);border-radius:12px;padding:1rem;color:var(--ink2);font-size:.95rem;background:var(--raised)}

/* 지수·수급 띠 */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(10.5rem,1fr);gap:.6rem;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.cell{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.7rem .85rem;display:grid;gap:.1rem}
.cell .k{font-size:.78rem;color:var(--ink2);font-weight:500} .cell .v{font-family:var(--mono);font-weight:600;font-size:1.15rem;letter-spacing:-.03em}
.cell .d{font-size:.8rem;font-family:var(--mono)} .cell svg{width:100%;height:1.6rem;display:block;margin-top:.2rem}

/* 주인공: 증권사 순매수 흐름 */
.hero{padding:1.1rem 1.1rem .9rem;box-shadow:var(--shadow)}
.hero .say{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.35;margin:.2rem 0 .1rem}
.hero .say b{font-family:var(--mono);font-weight:600;font-size:1.75rem;letter-spacing:-.04em;white-space:nowrap;display:block;line-height:1.25}
.hero .say .tail{white-space:nowrap}
.seg{display:inline-flex;background:var(--raised);border-radius:9px;padding:2px}
.seg button{padding:.3rem .7rem;border-radius:7px;font-size:.85rem;font-weight:600;color:var(--ink2);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.flow{width:100%;height:auto;display:block;margin-top:.5rem;overflow:visible}
.flow text{font-family:var(--mono);fill:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.8rem;color:var(--ink2);margin-top:.4rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem} .legend i{width:.9rem;height:3px;border-radius:2px;display:inline-block}

/* 주목 3종목 */
.picks{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.pick{display:grid;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;width:100%;transition:transform .15s,box-shadow .15s}
.pick:hover{transform:translateY(-2px);box-shadow:var(--shadow)} @media (prefers-reduced-motion:reduce){.pick{transition:none}.pick:hover{transform:none}}
.pick .hd{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.pick .no{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.85rem}
.pick h3{font-size:1.2rem;line-height:1.25} .pick .px{font-family:var(--mono);font-weight:600;font-size:1.05rem;text-align:right;white-space:nowrap}
.pick svg{width:100%;height:2.4rem;display:block} .pick p{margin:0;font-size:.9rem;color:var(--ink2)}
.meter{display:inline-flex;gap:2px;vertical-align:middle} .meter i{width:.42rem;height:.8rem;border-radius:2px;background:var(--line)} .meter i.on{background:var(--accent)}

/* 표·목록 */
.rows{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.7rem;align-items:center;padding:.6rem .25rem;border-top:1px solid var(--line);width:100%;min-height:52px;border-radius:8px}
.row:first-child{border-top:0} button.row:hover{background:var(--raised)}
.row .nm{font-weight:600;font-size:1rem;display:flex;flex-wrap:wrap;gap:.3rem .4rem;align-items:center} .row .rt{text-align:right;font-family:var(--mono);font-size:.92rem;white-space:nowrap}
.side{width:.3rem;align-self:stretch;border-radius:3px;background:var(--line)} .side.up{background:var(--up)} .side.down{background:var(--down)}
.rank-no{font-family:var(--mono);color:var(--ink3);width:1.6rem;text-align:center;font-size:.9rem}
.bar{height:.4rem;border-radius:3px;background:var(--raised);overflow:hidden;min-width:3rem} .bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-1rem;padding-inline:1rem} .chips.scroll::-webkit-scrollbar{display:none}
.chips button{padding:.4rem .8rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;color:var(--ink2);min-height:40px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-weight:500;color:var(--ink3);font-size:.78rem;text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle} tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--raised)} td.r,th.r{text-align:right} td .nm{font-weight:600;font-size:.98rem;white-space:nowrap}
@media (max-width:999px){ th,td{padding:.5rem .35rem} td .chip{margin-top:.15rem} }
.only-wide{display:none}

/* 트리맵 */
.tree{position:relative;width:100%;aspect-ratio:1/1.05;border-radius:12px;overflow:hidden;background:var(--raised)}
.tile{position:absolute;padding:.4rem .5rem;border:1px solid var(--surface);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;line-height:1.2}
.tile b{font-size:.9rem;font-weight:600;white-space:nowrap} .tile span{font-family:var(--mono);font-size:.8rem;font-weight:600;white-space:nowrap}
.tile.sm{padding:.25rem .3rem} .tile.sm b{font-size:.7rem;white-space:nowrap} .tile.sm span{font-size:.66rem}
.tile.xs{padding:.15rem .25rem;justify-content:center} .tile.xs b{font-size:.62rem;white-space:nowrap} .tile.xs span{display:none} .tile[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}

/* 일정 */
.ev{display:grid;grid-template-columns:3.6rem 1fr;gap:.75rem;padding:.6rem 0;border-top:1px solid var(--line)} .ev:first-child{border-top:0}
.ev .dd{font-family:var(--mono);font-weight:600;color:var(--accent)} .ev .dd small{display:block;color:var(--ink3);font-family:var(--body);font-weight:400;font-size:.75rem}
.ev h3{font-size:.98rem;font-family:var(--body);font-weight:600} .ev p{margin:.15rem 0 0;font-size:.85rem;color:var(--ink2)}
.filter label{display:flex;justify-content:space-between;gap:1rem;font-weight:500;font-size:.95rem} .filter input[type=range]{width:100%;accent-color:var(--accent);margin:.4rem 0 .6rem}
.check{display:flex;align-items:center;gap:.6rem;min-height:44px;font-size:.95rem} .check input{width:1.25rem;height:1.25rem;accent-color:var(--accent);margin:0}
dl.gloss{margin:0;display:grid;gap:.7rem} dl.gloss dt{font-weight:600} dl.gloss dd{margin:0;color:var(--ink2);font-size:.92rem}

/* 종목 서랍 */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s} .scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(30rem,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:calc(.9rem + env(safe-area-inset-top,0px)) 16px calc(2rem + env(safe-area-inset-bottom,0px));display:grid;gap:.8rem;align-content:start}
.drawer.on{transform:none} @media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer .bar2{display:flex;justify-content:space-between;align-items:center}
.close{padding:.5rem .8rem;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:600;min-height:44px}
.star{font-size:1.5rem;line-height:1;color:var(--ink3);padding:.3rem .5rem;min-height:44px} .star[aria-pressed="true"]{color:#E0A100}
.drawer h2{font-size:1.6rem} .now{font-family:var(--mono);font-weight:600;font-size:1.5rem;letter-spacing:-.03em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem} .kv div{background:var(--raised);border-radius:10px;padding:.55rem .6rem}
.kv .v{font-family:var(--mono);font-weight:600;font-size:1.15rem;display:block} .kv .k{font-size:.76rem;color:var(--ink2);line-height:1.3;display:block}
.why{margin:0;padding-left:1.1rem;display:grid;gap:.3rem;font-size:.95rem}
.big-spark{width:100%;height:5rem;display:block}
.holder{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.6rem;align-items:baseline;padding:.5rem 0;border-top:1px solid var(--line);font-size:.92rem} .holder:first-child{border-top:0}

/* 하단 탭(핸드폰) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{padding:.7rem 0 .6rem;text-align:center;font-size:.85rem;color:var(--ink3);font-weight:500;min-height:52px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}
.foot{font-size:.78rem;color:var(--ink3);padding:0 .25rem}

@media (min-width:1000px){
  .stamp .asof{display:inline} .nav{display:flex} .tabbar{display:none} .page{grid-template-columns:minmax(0,1fr) 21rem;padding-bottom:2rem}
  .page.single{grid-template-columns:minmax(0,1fr)} .rail{position:sticky;top:4.2rem;align-self:start}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start} .only-wide{display:table-cell} .only-narrow{display:none}
  .tree{aspect-ratio:16/10}
  .hero .say{font-size:1.3rem} .hero .say b{font-size:2.1rem;display:inline} .hero .say .tail{margin-left:.3em}
}
</style>

<div id="app"></div>
<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer" aria-label="종목 상세" aria-hidden="true"></aside>

<script>
/* ── 서버에 못 붙을 때만 쓰는 가상 예시(실제 종목·수치 아님). 모양은 /api/bootstrap · /api/live 와 같다 ── */
function sampleData(){
  const ko={NEW:"신규편입",EXIT:"편출",UP:"확대",DOWN:"축소"};
  const mk=(code,name,theme,cap,score,A,B,C,kind,net,str,nUp,nDown,act,streak,holders,extra)=>{
    const dir=net>0?1:net<0?-1:0,hist=[],px=[];
    for(let i=0;i<20;i++){const d=new Date(2026,8,18-(19-i));hist.push({d:d.toISOString().slice(0,10),v:Math.round(cap/4*1e4*(1+dir*0.012*i+Math.sin(i*1.7+cap)*0.006))});}
    for(let i=0;i<30;i++)px.push(Math.round(20000*(1+dir*0.006*i+Math.sin(i*0.9+cap)*0.03)));
    const div=!!(nUp&&nDown),moves=nUp+nDown,conv=kind?Math.round(Math.min(40,10*moves)+Math.min(40,40*str)+Math.min(20,10*act)):0;
    const tags=(kind?[ko[kind]]:[]).concat(div?["엇갈림"]:[],act?["액티브 "+act+"곳"]:[],Math.abs(streak)>=3?[Math.abs(streak)+"일 연속"]:[],extra||[]);
    const why=kind==="NEW"?`ETF ${nUp}곳이 새로 담기 시작했습니다.`:kind==="EXIT"?`ETF ${nDown}곳이 전부 팔고 나갔습니다.`:kind==="UP"?`ETF ${nUp}곳이 주식수를 늘렸습니다.`:kind==="DOWN"?`ETF ${nDown}곳이 주식수를 줄였습니다.`:"최근 기준일에는 변화가 없습니다.";
    const whys=kind?[`추정 ${net>0?"매수":"매도"} 규모는 약 ${Math.abs(net/1e8).toLocaleString()}억 원, 평소 하루 거래대금의 ${str}배입니다.`].concat(act?[`그중 ${act}곳은 운용역이 직접 고르는 액티브 ETF입니다.`]:[],Math.abs(streak)>=3?[`${Math.abs(streak)}거래일 연속 ${streak>0?"늘리는":"줄이는"} 중입니다.`]:[],[`ETF 보유 물량이 평소 거래량의 ${B}일치라 ETF 매매에 민감한 종목입니다.`]):[`ETF들이 가진 물량이 평소 거래량의 ${B}일치입니다. ETF가 움직이면 주가 영향이 큽니다.`];
    return {code,name,theme,cap,score,A,B,C,kind,net,str,n_up:nUp,n_down:nDown,n_act_moves:act,streak,conv,div,px,etfN:holders.length,actN:holders.filter(h=>h[1]).length,tags,why,whys,hist,
      holders:holders.map((h,i)=>({etf:"E_"+h[0],name:h[0],active:!!h[1],hot:true,w:h[2],kind:h[3]||null,pct:h[4]??null,amt:h[3]?Math.round(net/Math.max(1,nUp+nDown))*(/DOWN|EXIT/.test(h[3])&&net>0?-0.3:1):null}))};
  };
  const L=[

function treemap(items,W,H){ /* 큰 것부터 둘로 나눠 가며 긴 변을 자른다 */

  <div><span class="chip">${s.theme}</span> ${kindChip(s.kind)}${s.div?' <span class="chip warn">엇갈림</span>':""}<h2>${s.name}</h2>${x?`<div class="now">${x.price.toLocaleString()}원 <span class="${sgn(x.chg)}" style="font-size:1.05rem">${pct(x.chg,2)}</span></div>`:""}<p style="margin:.4rem 0 0">${s.why}</p></div>
  <section class="card"><header><h2>30일 주가</h2></header>${spark(s.px,trend(s.px),80).replace("<svg","<svg class=\"big-spark\"")||'<p class="sub">가격 자료가 없습니다.</p>'}</section>
  <section class="card"><header><h2>이유</h2>${s.kind?`<span class="sub">확신도 ${meter(s.conv)} <span class="num">${s.conv}</span></span>`:""}</header><ul class="why">${s.whys.map(t=>`<li>${t}</li>`).join("")}</ul>${s.tags.some(t=>/상한/.test(t))?`<div class="tip" style="margin:.6rem 0 0;background:var(--warn-bg);color:var(--warn)"><b>주의</b> · 정기변경 때 <b>매도</b>가 나올 수 있습니다.</div>`:""}</section>
  <section class="card"><header><h2>ETF 영향도</h2><b class="num" style="color:var(--accent);font-size:1.3rem">${s.score}점</b></header><div class="kv"><div><span class="v">${s.A}%</span><span class="k">지분 중 ETF</span></div><div><span class="v">${s.B}일</span><span class="k">거래량 대비</span></div><div><span class="v">${s.C}%</span><span class="k">핫 ETF 몫</span></div></div><p class="sub" style="margin:.6rem 0 0">시총 ${capTxt(s.cap)} · ETF ${s.etfN} (액티브 ${s.actN})</p></section>
  <section class="card"><header><h2>ETF 보유 주식수</h2></header>${hv.length>1?spark(hv,s.net<0?"var(--down)":"var(--up)",70).replace("<svg","<svg class=\"big-spark\"")+`<div class="sub" style="display:flex;justify-content:space-between"><span>${dateKo(s.hist[0].d)} <span class="num">${Math.round(hv[0]/1e4).toLocaleString()}만 주</span></span><span>${dateKo(s.hist[hv.length-1].d)} <span class="num">${Math.round(hv[hv.length-1]/1e4).toLocaleString()}만 주</span></span></div>`:`<p class="sub" style="margin:0">지금 <b class="num">${hv.length?Math.round(hv[0]/1e4).toLocaleString():"–"}만 주</b> · 추이는 쌓이는 중</p>`}</section>
  <section class="card"><header><h2>보유 ETF</h2><span class="sub">비중</span></header>${s.holders.map(h=>`<div class="holder"><span><button data-act="etf" data-v="${h.etf}" style="text-decoration:underline;text-underline-offset:3px">${h.name}</button>${h.active?' <span class="chip acc">액티브</span>':""}${h.hot?' <span class="chip">잘나감</span>':""}</span><span class="num">${h.w?h.w.toFixed(1)+"%":"–"}</span><span class="${cls(h.kind)}" style="font-weight:600;min-width:5.5rem;text-align:right">${h.kind?`${ARROW[h.kind]} ${KO[h.kind]}${h.amt?`<br><span class="num" style="font-weight:500;font-size:.85rem">${eokTxt(h.amt)}</span>`:""}`:'<span class="muted">–</span>'}</span></div>`).join("")}
    </section>`;
}

/* ── ETF · 시장 · 테마 상세 ── */
const dHead=`<div class="bar2"><button class="close" data-act="close">‹ 닫기</button></div>`;
function etfHTML(e){
  const moved=e.holdings.filter(h=>h.kind),buy=moved.filter(h=>h.amt>0).reduce((a,h)=>a+h.amt,0),sell=moved.filter(h=>h.amt<0).reduce((a,h)=>a+h.amt,0),mw=Math.max(1,...e.holdings.map(h=>h.w));
  const l=(LIVE.etfs||[]).find(x=>x.code===e.code);
  return dHead+`<div><span class="chip">${e.theme}</span>${e.active?' <span class="chip acc">액티브</span>':""}${e.hot?' <span class="chip up">잘나감</span>':""}<h2>${e.name}</h2><p class="sub" style="margin:.3rem 0 0">${e.index||""}${e.issuer?" · "+e.issuer:""}</p></div>
  <section class="card"><div class="kv"><div><span class="v">${capTxt(e.aum)}</span><span class="k">순자산</span></div><div><span class="v ${sgn(e.ret3m)}">${pct(e.ret3m)}</span><span class="k">3개월</span></div><div><span class="v ${l?sgn(l.chg):""}">${l?pct(l.chg):"–"}</span><span class="k">오늘</span></div></div>
    ${e.flow!=null?`<p class="sub" style="margin:.6rem 0 0">수급 <b class="num ${sgn(e.flow)}">${eokTxt(e.flow*1e8)}</b></p>`:""}</section>
  ${moved.length?`<section class="card"><header><h2>매매</h2><span class="sub">${dateKo(e.asof)}</span></header><div class="kv" style="margin-bottom:.5rem"><div><span class="v up">${eokTxt(buy)}</span><span class="k">매수</span></div><div><span class="v down">${eokTxt(sell)}</span><span class="k">매도</span></div><div><span class="v">${moved.length}</span><span class="k">종목</span></div></div>
    <div class="rows">${moved.sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt)).map(h=>`<button class="row" data-act="open" data-v="${h.code||""}"><span class="side ${sgn(h.amt)}"></span><span><span class="nm">${h.name} ${kindChip(h.kind)}</span><span class="sub">${h.pct!=null?`주식수 <span class="num">${pct(h.pct*100,0)}</span> · `:""}비중 <span class="num">${h.w}%</span></span></span><span class="rt ${sgn(h.amt)}">${eokTxt(h.amt)}</span></button>`).join("")}</div></section>`:""}
  <section class="card"><header><h2>구성종목</h2><span class="sub">${e.count}개${e.est?" · 비중 추정":""}</span></header><div class="rows">${e.holdings.filter(h=>h.kind!=="EXIT").map((h,i)=>`<button class="row" data-act="open" data-v="${h.code||""}" ${h.code?"":"disabled"}><span class="rank-no">${i+1}</span><span><span class="nm">${h.name} ${kindChip(h.kind)}</span><span class="bar" style="display:block;margin-top:.3rem"><i style="width:${h.w/mw*100}%"></i></span></span><span class="rt" style="font-weight:600">${h.w}%</span></button>`).join("")}</div>
    ${e.count>40?`<p class="sub" style="margin:.5rem 0 0">상위 40개</p>`:""}</section>`;
}
function marketHTML(k){
  const m=(LIVE.market||{})[k],I=(LIVE.index||{})[k],pts=(LIVE.series||{})[k]||[],nm=k==="KOSPI"?"코스피":"코스닥";
  const rows=m?[["증권사","fin"],["기관","inst"],["외국인","foreign"],["개인","indiv"],["프로그램 차익","arb"],["프로그램 비차익","nonarb"]].filter(r=>m[r[1]]!=null):[];
  return dHead+`<div><h2>${nm}</h2>${I?`<div class="now">${I.price.toLocaleString(undefined,{minimumFractionDigits:2})} <span class="${sgn(I.chg)}" style="font-size:1.05rem">${pct(I.chg,2)}</span></div>`:""}</div>
  ${pts.length>1?`<section class="card"><header><h2>순매수 흐름</h2><span class="sub">${hhmm(m&&m.time)}</span></header>${flowChart(pts,true)}</section>`:""}
  ${rows.length?`<section class="card"><header><h2>투자자별</h2></header><div class="rows">${rows.map(r=>`<div class="row"><span class="side ${sgn(m[r[1]])}"></span><span class="nm">${r[0]}</span><span class="rt ${sgn(m[r[1]])}" style="font-size:1.05rem;font-weight:600">${eokTxt(m[r[1]])}</span></div>`).join("")}</div></section>`:`<div class="empty">장이 열리면 나옵니다.</div>`}`;
}
function themeHTML(t){
  return dHead+`<div><h2>${t.n}</h2><p class="sub" style="margin:.3rem 0 0">ETF ${t.etfs}개 · 순자산 ${capTxt(t.aum)}</p></div>
  <section class="card"><div class="kv"><div><span class="v ${sgn(t.ret3m)}">${pct(t.ret3m)}</span><span class="k">3개월</span></div><div><span class="v ${sgn(((LIVE.themes||{})[t.n]||{}).chg)}">${pct(((LIVE.themes||{})[t.n]||{}).chg,2)}</span><span class="k">오늘</span></div><div><span class="v ${sgn(t.flow)}">${B.prev?eokTxt(t.flow*1e8):"–"}</span><span class="k">수급</span></div></div>
    <p class="sub" style="margin:.6rem 0 0">거래대금 <b class="num">${((LIVE.themes||{})[t.n]||{}).amt?eokTxt(((LIVE.themes||{})[t.n]).amt).replace("+",""):"–"}</b> · 매수 ${t.up.length} · 매도 ${t.down.length}</p></section>
  <section class="card"><header><h2>ETF</h2></header><div class="rows">${(t.etfList||[]).map((e,i)=>`<button class="row" data-act="etf" data-v="${e.code}"><span class="rank-no">${i+1}</span><span><span class="nm">${e.name}${e.active?' <span class="chip acc">액티브</span>':""}</span><span class="sub">${capTxt(e.aum)}</span></span><span class="rt ${sgn(e.ret3m)}">${pct(e.ret3m)}</span></button>`).join("")||'<p class="sub">없음</p>'}</div></section>
  <section class="card"><header><h2>민감 종목</h2></header><div class="rows">${(t.top||[]).filter(S).map((c,i)=>{const s=S(c);return `<button class="row" data-act="open" data-v="${c}"><span class="rank-no">${i+1}</span><span><span class="nm">${s.name} ${kindChip(s.kind)}</span><span class="sub">영향도 ${s.score} · ${s.B}일치</span></span><span class="rt">${liveTxt(c)}</span></button>`;}).join("")||'<p class="sub">없음</p>'}</div></section>`;
}
function sampleEtf(code){
  const hs=[];Object.values(B.stocks).forEach(s=>s.holders.forEach(h=>{if(h.etf===code)hs.push({name:s.name,code:s.code,w:h.w,kind:h.kind,pct:h.pct,amt:h.amt,meta:h,theme:s.theme});}));
  const hot=B.hotEtfs.find(e=>e.code===code);if(!hs.length&&!hot)return null;
  return {code,name:hot?hot.name:hs[0].meta.name,theme:hot?hot.theme:hs[0].theme,active:hot?hot.active:hs[0].meta.active,hot:true,asof:B.asof,index:"예시 지수",issuer:"",aum:hot?hot.aum:2400,ret3m:hot?hot.ret3m:18.2,flow:120,est:false,count:hs.length,holdings:hs.sort((a,b)=>b.w-a.w)};
}
async function getEtf(code){
  if(B.sample)return sampleEtf(code);
  try{const r=await fetch(B.static?`./data/etf/${code}.json`:`/api/etf/${code}`,{cache:"no-store"});return r.ok?await r.json():null;}catch(e){return null;}
}

/* ── 그리기와 조작 ── */
function render(){ if(!B)return; $("app").innerHTML=appHTML(); }
function showDrawer(html){ $("drawer").innerHTML=html; $("drawer").classList.add("on"); $("scrim").classList.add("on"); $("drawer").setAttribute("aria-hidden","false"); $("drawer").scrollTop=0; document.body.style.overflow="hidden"; }
async function openEtf(code){ st.open="etf:"+code; showDrawer(dHead+`<p class="sub">불러오는 중…</p>`); const e=await getEtf(code); if(st.open!=="etf:"+code)return; showDrawer(e?etfHTML(e):dHead+`<div class="empty">자료 없음</div>`); }
function openDrawer(code){ if(!S(code))return; st.open=code; showDrawer(drawerHTML(S(code))); }
function closeDrawer(){ if(st.open)setTimeout(render,0); st.open=null; $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); $("drawer").setAttribute("aria-hidden","true"); document.body.style.overflow=""; }
function setFont(big){ document.documentElement.classList.toggle("big",big); try{localStorage.setItem("etfradar.big",big?"1":"0");}catch(e){} }
async function toggleWatch(code){
  const on=B.watch.includes(code);
  if(B.sample||B.static){B.watch=on?B.watch.filter(c=>c!==code):B.watch.concat(code);if(B.static){try{localStorage.setItem("etfradar.watch",JSON.stringify(B.watch));}catch(e){}}return;}
  try{const r=await fetch("/api/watch/"+code,{method:on?"DELETE":"POST"});if(r.ok)B.watch=(await r.json()).watch;}catch(e){}
}
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  if(a==="open"){if(v)openDrawer(v);return;} if(a==="close"){closeDrawer();return;}
  if(a==="etf"){openEtf(v);return;}
  if(a==="market"){st.open="mkt:"+v;showDrawer(marketHTML(v));return;}
  if(a==="theme"){const t=B.themes.find(x=>x.n===v);if(t){st.open="theme:"+v;showDrawer(themeHTML(t));}return;}
  if(a==="watch"){await toggleWatch(v);if(st.open)$("drawer").innerHTML=drawerHTML(S(st.open));render();return;}
  if(a==="font")setFont(v==="1");
  if(a==="tip"){ev.stopPropagation();st.tip=st.tip===v?null:v;}
  if(a==="tab"){st.tab=v;st.tip=null;}
  if(a==="sig")st.sig=v; if(a==="mkt")st.mkt=v; if(a==="tm")st.tm=v; if(a==="sv")st.sv=v;
  if(a==="etff")st.etf=v||null;
  render(); if(a==="tab")scrollTo({top:0});
});
matchMedia("(min-width:1000px)").addEventListener("change",()=>{if(!st.open)render();});  /* 폭이 바뀌면 표 ↔ 행, 그래프 판을 다시 고른다 */
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&st.open)closeDrawer();});
document.addEventListener("input",ev=>{
  if(ev.target.id==="noReit2"){st.noReit=ev.target.checked;render();return;}
  if(ev.target.id==="noReit")st.noReit=ev.target.checked;else if(ev.target.id==="capMax"){st.cap=+ev.target.value;$("capLbl").textContent=capTxt(st.cap)+" 이하";}else return;
  $("ranklist").innerHTML=rankRows();$("rankN").textContent=ranked().length;
});
async function getBoot(){
  try{const r=await fetch("/api/bootstrap",{cache:"no-store"});if(r.status===401){location.href="/login";return null;}if(r.ok&&(r.headers.get("content-type")||"").includes("json"))return await r.json();}catch(e){}
  try{const r=await fetch("./data/bootstrap.json",{cache:"no-store"});if(r.ok)return {...await r.json(),static:true};}catch(e){}  /* GitHub Pages: 서버가 올려 둔 결과 파일 */
  return null;
}
async function loadLive(){ if(B.sample)return; try{const r=await fetch(B.static?"./data/live.json":"/api/live",{cache:"no-store"});if(r.ok){LIVE=await r.json();if(!st.open&&!document.querySelector("#capMax:active"))render();}}catch(e){} }
async function load(){
  B=await getBoot();
  if(!B){B=sampleData();LIVE=sampleLive(B);}
  if(B.static){try{const w=JSON.parse(localStorage.getItem("etfradar.watch")||"[]");if(Array.isArray(w))B.watch=w;}catch(e){}}
  render(); const m=location.hash.match(/^#stock\/(\w+)/);if(m)openDrawer(m[1]);
  if(!B.sample){await loadLive();setInterval(loadLive,30000);setInterval(async()=>{const n=await getBoot();if(n){if(B.static)n.watch=B.watch;B=n;if(!st.open)render();}},300000);}
}
let big=false;try{big=localStorage.getItem("etfradar.big")==="1";}catch(e){} setFont(big); load();
</script>
